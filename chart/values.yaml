# Default values for todo-app

replicaCount: 1

image:
  repository: ghcr.io/sharmistha2023/todo-app
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# DKubeX auto-provisioned PostgreSQL
# The platform injects postgres.db_url when dependencies includes "postgres"
postgres:
  db_url: ""

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

nodeSelector: {}
tolerations: []
affinity: {}
